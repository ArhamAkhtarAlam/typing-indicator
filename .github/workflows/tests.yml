# Runs on every pull request (and on main): all three have to be green before merging.
name: Tests

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    unit:
        name: Unit tests (npm test)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
            - run: npm ci --no-audit --no-fund
            - run: npm test

    vencord-build:
        name: Builds and type-checks inside Vencord
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: Vendicated/Vencord
                  path: vencord
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  package_json_file: vencord/package.json
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
            - name: Add plugins, type-check, build
              working-directory: vencord
              run: |
                  mkdir -p src/userplugins
                  for p in typingVerbs valorantDnd randomUwu autoMeow; do cp -R "../$p" src/userplugins/; done
                  pnpm install --frozen-lockfile
                  pnpm exec tsc --noEmit
                  pnpm build --standalone --disable-updater
                  for n in TypingVerbs ValorantDND RandomUwU AutoMeow; do
                      grep -q "name:\"$n\"" dist/renderer.js || { echo "::error::$n is missing from the build"; exit 1; }
                  done

    windows-installer:
        name: Windows installer (PowerShell 5.1)
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
            - run: npm ci --no-audit --no-fund
            - name: install-prebuilt.ps1 on fake Discord folders
              shell: powershell
              run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\installer.ps1
